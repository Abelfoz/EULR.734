<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EULR.734</title>
<style>
  /* ============================================================
     ПЕРЕМЕННЫЕ (цвета, шрифт)
     ============================================================ */
  :root {
    --bg: #050505;
    --panel: #0c0c0c;
    --line: #3b3b3b;
    --text: #cfcfcf;
    --dim: #7d7d7d;
    --accent: #9a6bff;
    --ok: #4caf50;
    --mono: "Courier New", Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
    overflow: hidden;
    font: 15px var(--mono);
    color: var(--text);
    user-select: none;
    background: var(--bg);
  }

  /* ============================================================
     СКРОЛЛБАР
     ============================================================ */
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-track { background: #050505; }
  ::-webkit-scrollbar-thumb { background: #2a1c4d; border: 1px solid var(--line); }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  /* ============================================================
     РАБОЧИЙ СТОЛ: сетка + ЭЛТ-мерцание + сканер (без виньетки)
     ============================================================ */
  #desktop {
    position: fixed;
    inset: 0 0 28px 0;
    background-color: var(--bg);
    background-image:
      linear-gradient(rgba(154, 107, 255, 0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(154, 107, 255, 0.05) 1px, transparent 1px);
    background-size: 40px 40px, 40px 40px;
    animation: crt-flicker 0.15s infinite;
  }
  @keyframes crt-flicker {
    0%   { opacity: 0.99; }
    50%  { opacity: 1; }
    100% { opacity: 0.98; }
  }

  /* Ползущая полоса-сканер поверх сетки */
  #desktop::after {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    background: linear-gradient(transparent, rgba(154,107,255,.06) 50%, transparent) 0 0 / 100% 300px no-repeat;
    animation: sweep 8s linear infinite;
  }
  @keyframes sweep {
    from { background-position: 0 -300px; }
    to   { background-position: 0 100vh; }
  }

  /* ============================================================
     УГЛОВЫЕ РАМКИ (декор)
     ============================================================ */
  .corner {
    position: fixed;
    width: 22px; height: 22px;
    z-index: 2;
    pointer-events: none;
    opacity: .5;
  }
  .corner.a { top: 10px;    left: 10px;  border-top: 2px solid var(--accent);    border-left: 2px solid var(--accent); }
  .corner.b { top: 10px;    right: 10px; border-top: 2px solid var(--accent);    border-right: 2px solid var(--accent); }
  .corner.c { bottom: 38px; left: 10px;  border-bottom: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .corner.d { bottom: 38px; right: 10px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }

  /* ============================================================
     ИКОНКИ НА СТОЛЕ
     ============================================================ */
  .icon {
    position: absolute;
    width: 128px;
    padding: 8px 6px;
    text-align: center;
    cursor: pointer;
    border: 1px solid transparent;
    color: var(--text);
    font-size: 13px;
    line-height: 1.35;
    overflow-wrap: break-word;
    z-index: 2;
  }
  .icon svg {
    width: 42px; height: 42px;
    display: block;
    margin: 0 auto 6px;
    stroke: var(--text);
    fill: none;
    stroke-width: 1.2;
  }
  .icon svg text { fill: var(--text); stroke: none; }
  .icon span {
    background: rgba(0,0,0,.85);
    padding: 2px 6px;
    display: inline-block;
    max-width: 100%;
    border: 1px solid transparent;
    transition: border-color 0.2s;
  }
  .icon.sel { border-color: var(--accent); }
  .icon.sel svg { stroke: var(--accent); }
  .icon.sel svg text { fill: var(--accent); }
  .icon.sel span { background: var(--accent); color: #000; border-color: var(--accent); }

  .icon.center { width: 160px; }
  .icon.center svg { width: 60px; height: 60px; }
  .icon.center span { font-size: 14px; }

  /* Позиции центральных иконок */
  .icon[data-w="info"]    { left: calc(50% - 260px); top: 32%; }
  .icon[data-w="story"]   { left: calc(50% +  100px); top: 32%; }
  .icon[data-w="journal"] { left: calc(50% -  80px);  top: 56%; }

  /* Позиции угловых иконок */
  .icon[data-w="pw"]    { left: 4%;  top: 8%; }
  .icon[data-w="game"]  { left: 4%;  top: 72%; }
  .icon[data-w="notes"] { left: calc(100% - 140px); top: 8%; }
  .icon[data-w="trash"] { left: calc(100% - 140px); top: 72%; }

  /* ============================================================
     АДАПТИВ: планшет
     ============================================================ */
  @media (max-width: 900px) {
    .icon.center { width: 140px; }
    .icon.center svg { width: 52px; height: 52px; }
    .icon[data-w="info"]    { left: calc(50% - 230px); top: 32%; }
    .icon[data-w="story"]   { left: calc(50% +  90px); top: 32%; }
    .icon[data-w="journal"] { left: calc(50% -  70px); top: 58%; }
  }

  /* ============================================================
     АДАПТИВ: телефон
     ============================================================ */
  @media (max-width: 700px) {
    .icon { width: 100px; font-size: 12px; }
    .icon.center { width: 110px; }
    .icon.center svg { width: 44px; height: 44px; }

    .icon[data-w="info"]    { left: 4%; top: 8%; }
    .icon[data-w="story"]   { left: 4%; top: 30%; }
    .icon[data-w="journal"] { left: 4%; top: 52%; }
    .icon[data-w="pw"]      { left: calc(100% - 110px); top: 8%; }
    .icon[data-w="notes"]   { left: calc(100% - 110px); top: 30%; }
    .icon[data-w="game"]    { left: calc(100% - 110px); top: 52%; }
    .icon[data-w="trash"]   { left: calc(100% - 110px); top: 74%; }
  }

  /* ============================================================
     ОКНА
     ============================================================ */
  .win {
    position: absolute;
    display: none;
    flex-direction: column;
    background: var(--panel);
    border: 1px solid var(--line);
    box-shadow: 0 0 0 1px #000, 8px 8px 0 rgba(0,0,0,.6);
    min-width: 320px;
    overflow: hidden;
    z-index: 10;
  }
  .win.open { display: flex; animation: winIn .14s ease-out; }
  .win.active { border-color: var(--accent); }
  @keyframes winIn {
    from { opacity: 0; transform: scale(.97); }
  }

  /* --- Шапка окна (drag) --- */
  .tb {
    height: 30px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 0 4px 0 10px;
    background: #000;
    border-bottom: 1px solid var(--line);
    cursor: move;
    touch-action: none;
    color: var(--dim);
    font-size: 13px;
  }
  .win.active .tb { color: var(--text); border-bottom-color: var(--accent); }
  .tb .t {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    letter-spacing: .06em;
  }
  .tb .t::before { content: "▪ "; color: var(--accent); }
  .tb button {
    width: 24px; height: 22px;
    border: 1px solid var(--line);
    background: #000;
    color: var(--text);
    font: 14px var(--mono);
    padding: 0;
    cursor: pointer;
  }
  .tb button:hover { background: var(--accent); border-color: var(--accent); color: #000; }

  /* --- Строка меню внутри окна --- */
  .menu {
    display: flex;
    gap: 14px;
    padding: 4px 12px;
    border-bottom: 1px solid var(--line);
    color: var(--dim);
    font-size: 13px;
  }

  /* --- Тело окна --- */
  .body {
    padding: 16px;
    overflow: auto;
    flex: 1;
    background: var(--panel);
    user-select: text;
    font-size: 15px;
    line-height: 1.5;
  }

  /* ============================================================
     ТИПОГРАФИКА ВНУТРИ ОКОН
     ============================================================ */
  .nm {
    font-weight: normal;
    font-size: 34px;
    letter-spacing: 2px;
    margin: 0 0 18px;
    padding-bottom: 10px;
    border-bottom: 2px solid;
    border-image: linear-gradient(90deg, var(--accent), transparent) 1;
  }
  .h2 {
    font-size: 19px;
    border-bottom: 1px solid var(--line);
    padding-bottom: 5px;
    margin: 0 0 14px;
    font-weight: normal;
  }
  .h2::before { content: "// "; color: var(--accent); }
  .h2 small { color: var(--dim); font-size: 13px; margin-left: 10px; }

  /* ============================================================
     ДОСЬЕ: блок «инфо» (фото + таблица)
     ============================================================ */
  .info { display: flex; gap: 18px; align-items: flex-start; }
  .pf { width: 220px; flex: none; }

  .frame {
    position: relative;
    border: 1px solid var(--line);
    padding: 4px;
    background: #000;
  }
  .frame::before, .frame::after {
    content: "";
    position: absolute;
    width: 12px; height: 12px;
    pointer-events: none;
  }
  .frame::before { top: -1px; left: -1px; border-top: 2px solid var(--accent); border-left: 2px solid var(--accent); }
  .frame::after  { bottom: -1px; right: -1px; border-bottom: 2px solid var(--accent); border-right: 2px solid var(--accent); }
  .frame img { display: block; width: 100%; filter: grayscale(1) contrast(1.1); }

  /* Заглушка «нет изображения» */
  .ph {
    aspect-ratio: 3/4;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    color: var(--dim);
    font-size: 13px;
    letter-spacing: 1px;
    background:
      linear-gradient(135deg, transparent 49%, var(--line) 49%, var(--line) 51%, transparent 51%),
      linear-gradient(45deg,  transparent 49%, var(--line) 49%, var(--line) 51%, transparent 51%),
      #030303;
  }
  .tag { margin: 8px 0 0; font-size: 13px; color: var(--dim); letter-spacing: 1px; }

  .appearance { margin-top: 14px; font-size: 13px; color: var(--dim); line-height: 1.5; }
  .appearance .text { color: var(--text); font-size: 13px; }

  table.d { border-collapse: collapse; width: 100%; }
  table.d td {
    padding: 8px 10px;
    vertical-align: top;
    border-bottom: 1px dotted var(--line);
    font-size: 15px;
  }
  table.d td:first-child { width: 38%; color: var(--dim); }
  .st-ok { color: var(--ok); }

  /* ============================================================
     СПИСКИ / ЗАГОЛОВКИ-РАЗДЕЛИТЕЛИ
     ============================================================ */
  .items-block { margin-top: 18px; }
  .items-list {
    list-style: none;
    margin: 0; padding: 0;
    border-top: 1px dotted var(--line);
  }
  .items-list li {
    padding: 6px 0;
    border-bottom: 1px dotted var(--line);
    font-size: 14px;
    display: flex;
    align-items: baseline;
    gap: 8px;
  }
  .items-list li::before { content: "▸"; color: var(--accent); font-size: 13px; flex: none; }

  .sub {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--accent);
    font-size: 16px;
    letter-spacing: .12em;
    margin: 22px 0 10px;
  }
  .sub::after { content: ""; flex: 1; border-bottom: 1px solid var(--line); }

  /* ============================================================
     ТАЙМЛАЙН (жизненный отчёт)
     ============================================================ */
  .tl { position: relative; padding-left: 24px; }
  .tl::before {
    content: "";
    position: absolute;
    left: 5px; top: 6px; bottom: 6px;
    width: 1px;
    background: linear-gradient(var(--accent), var(--line) 25%, var(--line));
  }
  .tl .lg {
    color: var(--accent);
    font-size: 13px;
    letter-spacing: 1px;
    margin: 14px 0 4px;
    position: relative;
  }
  .tl .lg:first-child { margin-top: 0; }
  .tl .lg::before {
    content: "";
    position: absolute;
    left: -24px; top: 50%;
    width: 7px; height: 7px; margin-top: -4px;
    background: var(--accent);
    transform: rotate(45deg);
  }
  .tl p { margin: 0 0 12px; line-height: 1.6; font-size: 15px; }

  /* ============================================================
     ФОТО ВНУТРИ ТЕКСТА (обтекание)
     ============================================================ */
  .inline-photo {
    float: right;
    width: 210px;
    margin: 0 0 12px 16px;
    clear: both;
  }
  .inline-photo .ph { aspect-ratio: 4/3; }
  .inline-photo img {
    aspect-ratio: 4/3;
    width: 100%; height: auto;
    object-fit: cover;
    filter: grayscale(1) contrast(1.1);
    display: block;
  }
  .inline-photo .caption {
    margin: 6px 0 0;
    font-size: 12px;
    color: var(--dim);
    text-align: center;
    letter-spacing: 1px;
  }

  /* ============================================================
     ПЕЧАТЬ «КОНЕЦ ОТЧЁТА»
     ============================================================ */
  .stamp {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 18px;
    color: var(--dim);
    font-size: 13px;
    clear: both;
  }
  .stamp::before, .stamp::after { content: ""; flex: 1; border-bottom: 1px solid var(--line); }

  /* ============================================================
     ЭЛЕМЕНТЫ ФОРМ
     ============================================================ */
  .btn {
    border: 1px solid var(--line);
    background: #000;
    color: var(--text);
    font: 14px var(--mono);
    padding: 6px 16px;
    cursor: pointer;
  }
  .btn:hover { background: var(--accent); color: #000; border-color: var(--accent); }

  .in {
    background: #000;
    border: 1px solid var(--line);
    color: var(--text);
    font: 15px var(--mono);
    padding: 6px 10px;
    width: 100%;
    margin: 10px 0;
  }

  /* ============================================================
     ФАЙЛЫ (сетка иконок внутри окон)
     ============================================================ */
  .files {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    justify-items: center;
  }
  a.f, .f {
    display: block;
    width: 100%;
    max-width: 130px;
    text-align: center;
    padding: 8px 4px;
    border: 1px solid transparent;
    font-size: 12px;
    line-height: 1.35;
    overflow-wrap: break-word;
    cursor: pointer;
    color: var(--text);
    text-decoration: none;
  }
  a.f:hover, .f:hover { border-color: var(--accent); }
  .f svg, a.f svg {
    width: 36px; height: 36px;
    display: block;
    margin: 0 auto 6px;
    stroke: var(--text);
    fill: none;
    stroke-width: 1.2;
  }

  /* ============================================================
     ОШИБКА / СЛУЖЕБНЫЕ
     ============================================================ */
  .err { text-align: center; padding: 26px 10px; }
  .err h3 { margin: 0 0 8px; color: var(--accent); font-weight: normal; font-size: 18px; }
  .dim { color: var(--dim); margin-top: 12px; }
  .row { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

  /* ============================================================
     НИЖНЯЯ ПАНЕЛЬ (таскбар)
     ============================================================ */
  #bar {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 28px;
    display: flex;
    align-items: center;
    background: #000;
    border-top: 1px solid var(--line);
    z-index: 9999;
  }
  #start {
    height: 100%;
    padding: 0 16px;
    display: flex;
    align-items: center;
    color: var(--accent);
    font: 13px var(--mono);
    letter-spacing: .15em;
    border-right: 1px solid var(--line);
  }
  #tasks { flex: 1; display: flex; gap: 4px; padding: 0 6px; overflow: hidden; }
  #clock {
    padding: 0 14px;
    border-left: 1px solid var(--line);
    height: 100%;
    display: flex;
    align-items: center;
    font-size: 13px;
  }

  /* ============================================================
     ВЕРХНИЙ HUD (звук)
     ============================================================ */
  #hud {
    position: fixed;
    top: 14px; right: 44px;
    z-index: 9000;
    display: flex;
    gap: 14px;
    align-items: center;
    color: var(--dim);
    font-size: 13px;
    letter-spacing: .1em;
  }
  #hud button {
    border: 1px solid var(--line);
    background: #000;
    color: var(--dim);
    font: 13px var(--mono);
    padding: 2px 10px;
    cursor: pointer;
  }
  #hud button:hover { color: var(--text); border-color: var(--accent); }

  /* ============================================================
     ЭКРАН ЗАГРУЗКИ
     ============================================================ */
  #boot {
    position: fixed; inset: 0;
    background: #000;
    z-index: 99999;
    padding: 6vh 6vw;
    font: 15px/1.7 var(--mono);
    cursor: default;
  }
  #boot pre { margin: 0; font: inherit; }
  #boot .bar {
    margin-top: 18px;
    width: min(420px, 80%);
    height: 10px;
    border: 1px solid var(--line);
    overflow: hidden;
  }
  #boot .bar i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--accent);
  }

  /* ============================================================
     АДАПТИВ: телефон (окна на весь экран)
     ============================================================ */
  @media (max-width: 700px) {
    .win { left: 0 !important; top: 0 !important; width: 100% !important; height: 100% !important; }
    .info { flex-direction: column; }
    .pf { width: 100%; }
    .pf .ph { height: 260px; }
    .inline-photo { float: none; width: 100%; margin: 0 0 12px; }
    #hud { top: auto; bottom: 10px; right: 10px; }
    .files { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>

<!-- ============================================================
     РАЗМЕТКА: стол, декор, HUD, загрузка, таскбар
     ============================================================ -->
<div id="desktop">
  <div class="icons" id="desktopIcons"></div>
</div>

<i class="corner a"></i>
<i class="corner b"></i>
<i class="corner c"></i>
<i class="corner d"></i>

<div id="hud">
  <button id="snd">♪ ВКЛ</button>
</div>

<div id="boot">
  <pre id="bootLog"></pre>
  <div class="bar"><i></i></div>
</div>

<div id="bar">
  <div id="start">EUSAN</div>
  <div id="tasks"></div>
  <div id="clock">--:--</div>
</div>

<script>
/* ============================================================
   ГЛАВНЫЙ МОДУЛЬ
   ============================================================ */
(function () {
  "use strict";

  /* ------------------------------------------------------------
     ССЫЛКИ НА ДОКУМЕНТЫ (внешние)
     ------------------------------------------------------------ */
  const LINKS = {
    codex:   "https://docs.google.com/document/d/1P8ISRAEpYdYWEQt8mFXJqSnaXmvsIGWeh8oXwyq1q00/edit?usp=drivesdk",
    canteen: "https://docs.google.com/spreadsheets/d/1uP-mLNswJB8nIMMGQ1U0dfh5rhVPBw6wIcGPdqcolhE/edit?usp=sharing",
    codex2:  "https://docs.google.com/document/d/15DvLnKrAVHlvJYeL9f6-hnZFL18m6HDRZvDFUs6pQfM/edit?tab=t.0#heading=h.bzy5co6eg6ep",
    bru:     "https://docs.google.com/document/d/1e9vHJ7oyyq_xN370jXSW0GjdRCTGCz3_B4-LDUbxA5k/edit?usp=sharing"
  };

  /* ------------------------------------------------------------
     ОПИСАНИЕ ИКОНОК НА СТОЛЕ
     ------------------------------------------------------------ */
  const ICONS = [
    { id: "info",    label: "Досье EULR.734",             icon: "pdf",    center: true },
    { id: "story",   label: "Отчёт EULR.734",             icon: "pdf",    center: true },
    { id: "journal", label: "Журнал отношений EULR.734",  icon: "pdf",    center: true, external: "https://docs.google.com/spreadsheets/d/16ro0dorbskF4sFZxUfz6yTNxkXIj4JWIoF36r1isE9I/edit?usp=sharing" },
    { id: "pw",      label: "Важное",                     icon: "folder" },
    { id: "notes",   label: "Заметки",                    icon: "doc"    },
    { id: "game",    label: "Пасьянс",                    icon: "card"   },
    { id: "trash",   label: "Корзина",                    icon: "trash"  }
  ];

  /* ------------------------------------------------------------
     SVG-ИКОНКИ
     ------------------------------------------------------------ */
  const SVG = {
    pdf:    `<svg viewBox="0 0 40 40"><path d="M8 3h17l8 8v26H8z"/><path d="M25 3v8h8"/><text x="20" y="31" font-size="9" text-anchor="middle">PDF</text></svg>`,
    folder: `<svg viewBox="0 0 40 40"><path d="M3 9h14l3 4h17v22H3z"/><path d="M3 16h34"/></svg>`,
    doc:    `<svg viewBox="0 0 40 40"><path d="M8 3h17l8 8v26H8z"/><path d="M25 3v8h8"/><path d="M12 18h17M12 23h17M12 28h11"/></svg>`,
    card:   `<svg viewBox="0 0 40 40"><rect x="9" y="4" width="22" height="32"/><text x="20" y="27" font-size="18" text-anchor="middle">♠</text></svg>`,
    trash:  `<svg viewBox="0 0 40 40"><path d="M8 11h24M15 11V7h10v4M11 11l2 26h14l2-26M17 17v14M23 17v14"/></svg>`
  };

  /* ------------------------------------------------------------
     ЗВУК
     ------------------------------------------------------------ */
  let AC = null;                       // AudioContext
  let mute = false;
  try { mute = localStorage.getItem("mute") === "1"; } catch (e) {}

  function tone(freq, dur, type, vol, at, glideTo) {
    if (!AC) return;
    const t = AC.currentTime + (at || 0);
    const o = AC.createOscillator();
    const g = AC.createGain();
    o.type = type || "square";
    o.frequency.setValueAtTime(freq, t);
    if (glideTo) o.frequency.linearRampToValueAtTime(glideTo, t + dur);
    g.gain.setValueAtTime(vol || 0.03, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(AC.destination);
    o.start(t); o.stop(t + dur);
  }

  function beep(kind, n) {
    if (mute) return;
    try {
      if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
      if (AC.state !== "running") { AC.resume(); return; }
      switch (kind) {
        case "tick":   tone(900, .04); break;
        case "open":   tone(420, .07, 0, 0, 0, 640); tone(640, .07, 0, 0, .06); break;
        case "close":  tone(640, .07, 0, 0, 0, 420); break;
        case "err":    tone(160, .18, "sawtooth", .05); tone(130, .22, "sawtooth", .05, .2); break;
        case "ok":     tone(880, .08); tone(1320, .12, 0, 0, .09); break;
        case "key":    tone(1400, .015, 0, .015); break;
        case "line":   tone(500 + (n || 0) * 70, .05); break;
        case "boot":   tone(330, .12); tone(495, .12, 0, 0, .12); tone(660, .28, 0, 0, .24); break;
        case "glitch": {
          const buf = AC.createBuffer(1, AC.sampleRate * .15, AC.sampleRate);
          const d = buf.getChannelData(0);
          for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
          const src = AC.createBufferSource();
          const g = AC.createGain();
          g.gain.value = .05;
          src.buffer = buf;
          src.connect(g); g.connect(AC.destination);
          src.start();
          break;
        }
      }
    } catch (e) {}
  }

  function makeWindow(id, title, x, y, w, h, innerHTML) {
    const win = document.createElement("div");
    win.className = "win";
    win.id = id;
    win.style.cssText = `left:${x}px;top:${y}px;width:${w}px;height:${h}px`;

    /* Перетаскивание за шапку */
    const tb = win.querySelector(".tb");
    tb.addEventListener("pointerdown", ev => {
      if (ev.target.tagName === "BUTTON") return;

      const r = win.getBoundingClientRect();
      const dx = ev.clientX - r.left;
      const dy = ev.clientY - r.top;
      tb.setPointerCapture(ev.pointerId);

      const SNAP = 24, MARGIN = 4;

      const move = m => {
        let newLeft = m.clientX - dx;
        let newTop  = m.clientY - dy;
        const w = win.offsetWidth;
        const h = win.offsetHeight;
        const maxLeft = innerWidth - w;
        const maxTop  = innerHeight - h - 30;

        newLeft = Math.max(MARGIN, Math.min(maxLeft - MARGIN, newLeft));
        newTop  = Math.max(MARGIN, Math.min(maxTop  - MARGIN, newTop));

        if (newLeft < SNAP) newLeft = MARGIN;
        else if (newLeft > maxLeft - SNAP) newLeft = maxLeft - MARGIN;

        if (newTop < SNAP) newTop = MARGIN;
        if (newTop > maxTop - SNAP) newTop = maxTop - MARGIN;

        win.style.left = newLeft + "px";
        win.style.top  = newTop + "px";
      };

      const up = () => {
        tb.removeEventListener("pointermove", move);
        tb.removeEventListener("pointerup", up);
      };
      tb.addEventListener("pointermove", move);
      tb.addEventListener("pointerup", up);
    });

    /* Кнопка закрытия */
    win.querySelector(".x").addEventListener("click", () => {
      win.classList.remove("open", "active");
      beep("close");
    });

    return win;
  }

      for (let i = 0; i < L; i++) {

        } else if ((i >= a && i < b) || (i >= c && i < d) || Math.random() < 0.04) {

    "Проверка целостности ........ ПРЕДУПРЕЖДЕНИЕ",
    "Сканирование секторов ...... 0x0000 - 0xFFFF",
    "Проверка ПЗУ ................ OK",
    "Инициализация контроллера ... OK",
    "Подключение к ERES-427 ...... OK",
    "Синхронизация времени ....... 11.11.2157",
    "Загрузка профиля: EULR.734 .. OK",
    "Применение политик .......... OK",
    "Запуск пользовательской среды",
    "Загрузка интерфейса ......... OK"
  ];

  let bootIndex = 0;
  let bootFinished = false;
  const bootEl  = document.getElementById("boot");
  const bootLog = document.getElementById("bootLog");

  /* Печать строк по таймеру */
  const bootTimer = setInterval(() => {
    if (bootIndex < bootLines.length) {
      beep("line", bootIndex);
      bootLog.textContent += bootLines[bootIndex++] + "\n";
    }
  }, 320);

  /* Полоска загрузки: анимируем через requestAnimationFrame */
  (function runBootBar() {
    const barFill = bootEl.querySelector(".bar i");
    if (!barFill) return;
    const DURATION = 5000;
    const start = performance.now();
    function step(now) {
      if (bootFinished) { barFill.style.width = "100%"; return; }
      const p = Math.min(1, (now - start) / DURATION);
      barFill.style.width = (p * 100) + "%";
      if (p < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  })();

  function finishBoot() {
    if (bootFinished) return;
    bootFinished = true;
    clearInterval(bootTimer);
    bootEl.remove();
    beep("boot");

    /* На десктопе автоматически открываем Досье и Отчёт */
    if (!matchMedia("(pointer:coarse)").matches && innerWidth > 700) {
      setTimeout(() => {
        const infoWin  = document.getElementById("info");
        const storyWin = document.getElementById("story");

        infoWin.style.left = "40px";
        infoWin.style.top  = "40px";
        infoWin.classList.add("open");
        focusWin(infoWin);

        const storyW = storyWin.offsetWidth  || 700;
        const storyH = storyWin.offsetHeight || 600;
        storyWin.style.left = Math.max(0, innerWidth  - storyW - 60) + "px";
        storyWin.style.top  = Math.max(0, innerHeight - storyH - 90) + "px";
        storyWin.classList.add("open");

        focusWin(infoWin);
      }, 200);
    }
  }
  setTimeout(finishBoot, 5000);

  /* ------------------------------------------------------------
     HUD: переключатель звука
     ------------------------------------------------------------ */
  const soundBtn = document.getElementById("snd");
  function updateSoundBtn() {
    soundBtn.textContent = mute ? "♪ ВЫКЛ" : "♪ ВКЛ";
  }
  updateSoundBtn();

  soundBtn.addEventListener("click", () => {
    mute = !mute;
    try { localStorage.setItem("mute", mute ? "1" : "0"); } catch (e) {}
    updateSoundBtn();
    if (!mute) beep("ok");
  });

  /* ------------------------------------------------------------
     КОНТЕКСТНОЕ МЕНЮ ОТКЛЮЧЕНО
     ------------------------------------------------------------ */
  document.addEventListener("contextmenu", e => e.preventDefault());

  /* ------------------------------------------------------------
     ЧАСЫ: всегда по Москве (UTC+3), без подписи
     ------------------------------------------------------------ */
  const clock = document.getElementById("clock");
  function tickClock() {
    const parts = new Intl.DateTimeFormat("ru-RU", {
      timeZone: "Europe/Moscow",
      hour: "2-digit",
      minute: "2-digit",
      hour12: false
    }).formatToParts(new Date());
    const hh = (parts.find(p => p.type === "hour")   || {}).value || "--";
    const mm = (parts.find(p => p.type === "minute") || {}).value || "--";
    clock.textContent = hh + ":" + mm;
  }
  tickClock();
  setInterval(tickClock, 15 * 1000);

})();
</script>
</body>
</html>
